name: board
# Daily: run every library whose latest PyPI release has no results yet, then rebuild the page.
on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:
    inputs:
      all:
        description: "Run every library again (not just new releases)"
        type: boolean
        default: false
      history:
        description: "Also test this many releases back (1 = latest only)"
        type: string
        default: "1"
      only:
        description: "Only these formats or library ids, comma-separated (empty = all)"
        type: string
        default: ""
permissions:
  contents: write
  pages: write
  id-token: write
concurrency: board
env:
  CORPUSDIFF: git+https://github.com/prometheus-maker/corpusdiff@2b98d0701f1440d57b6ab4d41b2de145d6b9c1aa
jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      count: ${{ steps.plan.outputs.count }}
    steps:
      - uses: actions/checkout@v4
      - id: plan
        run: |
          m=$(python3 board/plan.py ${{ inputs.all && '--all' || '' }} --history ${{ inputs.history || '1' }} ${{ inputs.only && format('--only {0}', inputs.only) || '' }})
          echo "matrix=$m" >> "$GITHUB_OUTPUT"
          echo "count=$(echo "$m" | python3 -c 'import json,sys;print(len(json.load(sys.stdin)["include"]))')" >> "$GITHUB_OUTPUT"
          echo "$m" | python3 -m json.tool

  run:
    name: ${{ matrix.fmt }} · ${{ matrix.lib }} ${{ matrix.version }}
    needs: plan
    if: needs.plan.outputs.count != '0'
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.13" }
      - uses: actions/cache@v4
        with:
          path: corpora/${{ matrix.corpus }}
          key: corpus-${{ matrix.corpus }}-${{ matrix.commit }}
      - name: System packages
        if: matrix.apt != ''
        run: sudo apt-get update -q && sudo apt-get install -y -q --no-install-recommends ${{ matrix.apt }}
      - name: Install
        run: |
          python -m venv /tmp/tool && /tmp/tool/bin/pip install -q "$CORPUSDIFF"
          python -m venv /tmp/lib && /tmp/lib/bin/pip install -q ${{ matrix.install }}
      - name: Fetch corpus
        env: { GITHUB_TOKEN: "${{ github.token }}" }
        run: /tmp/tool/bin/corpusdiff fetch ${{ matrix.corpus }} corpora/${{ matrix.corpus }} --ref ${{ matrix.commit }}
      - name: Warm up (model downloads don't count against the first file's time limit)
        if: matrix.warmup
        run: /tmp/lib/bin/python -c "import sys; sys.path.insert(0, 'board'); import targets; print(targets.${{ matrix.fn }}('board/warmup.png')['metrics'])" || true
      - name: Run
        run: |
          d="results/${{ matrix.fmt }}/${{ matrix.lib }}"; mkdir -p "$d" out
          /tmp/tool/bin/corpusdiff run board/targets.py:${{ matrix.fn }} corpora/${{ matrix.corpus }} \
            --ext ${{ matrix.ext }} --python /tmp/lib/bin/python -j ${{ matrix.jobs }} -t ${{ matrix.timeout }} --mem-mb ${{ matrix.mem_mb }} \
            --start-timeout 900 -q -o out/run.jsonl
          /tmp/tool/bin/corpusdiff summary out/run.jsonl | tee -a "$GITHUB_STEP_SUMMARY"
          gzip -9 -c out/run.jsonl > "$d/${{ matrix.version }}.jsonl.gz"
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            /tmp/lib/bin/python board/meta.py "$d/${{ matrix.version }}.json" ${{ matrix.pkg }} ${{ matrix.version }} \
            ${{ matrix.corpus }} ${{ matrix.commit }} ${{ matrix.timeout }}
      - uses: actions/upload-artifact@v4
        with:
          name: r-${{ matrix.fmt }}-${{ matrix.lib }}-${{ matrix.version }}
          include-hidden-files: true
          # only this run's two files: the checkout also holds older results, which must not overwrite newer ones
          # (results/.keep keeps the archive rooted at results/, so paths survive the merge)
          path: |
            results/.keep
            results/${{ matrix.fmt }}/${{ matrix.lib }}/${{ matrix.version }}.jsonl.gz
            results/${{ matrix.fmt }}/${{ matrix.lib }}/${{ matrix.version }}.json

  publish:
    needs: [plan, run]
    if: ${{ !cancelled() && needs.plan.result == 'success' }}  # runs if some libraries failed, not if cancelled
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { path: results, pattern: "r-*", merge-multiple: true }
      - name: Save results
        run: |
          git config user.name "reader-board bot"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results
          git diff --cached --quiet || git commit -qm "results: $(git diff --cached --name-only | grep -c 'jsonl.gz$') new runs"
          git pull -q --rebase origin main   # code may have changed while the runs ran
          git push
      - name: Build page
        env: { GITHUB_TOKEN: "${{ github.token }}" }
        run: python3 board/build.py site
      - uses: actions/upload-pages-artifact@v3
        with: { path: site }
      - id: deploy
        uses: actions/deploy-pages@v4
